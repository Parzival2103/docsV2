openapi: 3.0.3
info:
  title: 'Laravel API Documentation'
  description: 'WhatsApiLebytek public API v1 (nucleo skeleton).'
  version: 1.0.0
servers:
  -
    url: 'http://localhost'
tags:
  -
    name: Account
    description: ''
  -
    name: Admin
    description: ''
  -
    name: Instances
    description: ''
  -
    name: Messages
    description: ''
  -
    name: Platform
    description: ''
  -
    name: Tenants
    description: ''
  -
    name: Usage
    description: ''
  -
    name: Webhooks
    description: "\nIncoming webhook endpoint (HMAC signature or Bearer token).\n\nEvery valid event is persisted to int_webhooks before processing. The\nevent_id unique index is the deduplication authority; a collision returns\n200 {duplicate:true}. Processing happens asynchronously in ProcessWebhookJob."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'You can retrieve your token by visiting your dashboard and clicking <b>Generate API token</b>.'
security:
  -
    default: []
paths:
  /api/v1/account/status:
    post:
      summary: 'Account status (demo quota, plan, expiration)'
      operationId: accountStatusdemoQuotaPlanExpiration
      description: 'Returns days remaining, messages remaining, contracted plan and request timestamp.'
      parameters: []
      responses: {  }
      tags:
        - Account
  /api/v1/admin/demo-leads-snapshot:
    post:
      summary: 'Batch snapshot for admin demo leads (instance state + tenant activity).'
      operationId: batchSnapshotForAdminDemoLeadsinstanceState+TenantActivity
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  description: 'Must have at least 1 items. Must not have more than 100 items.'
                  example:
                    - []
                  items:
                    type: object
                    properties:
                      tenantPublicId:
                        type: string
                        description: 'Must be 26 characters.'
                        example: bngzmiyvdljnikhwaykcmyuwpw
                      instancePublicId:
                        type: string
                        description: 'Must be 26 characters.'
                        example: lvqwrsitcpscqldzsnrwtujwvl
                        nullable: true
                    required:
                      - tenantPublicId
              required:
                - items
  /api/v1/instances:
    get:
      summary: 'List instances for the acting tenant.'
      operationId: listInstancesForTheActingTenant
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Instances
    post:
      summary: 'Create instance (async provisioning).'
      operationId: createInstanceasyncProvisioning
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Instances
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                externalRef:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: 'n'
                  nullable: true
                purpose:
                  type: string
                  description: ''
                  example: demo
                  enum:
                    - demo
                    - production
                  nullable: true
              required:
                - label
  '/api/v1/instances/{instancia_public_id}':
    get:
      summary: 'Show instance status.'
      operationId: showInstanceStatus
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Instances
    delete:
      summary: 'Delete instance (async teardown).'
      operationId: deleteInstanceasyncTeardown
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Instances
    parameters:
      -
        in: path
        name: instancia_public_id
        description: 'The ID of the instancia public.'
        example: architecto
        required: true
        schema:
          type: string
  '/api/v1/instances/{instancia_public_id}/qr':
    get:
      summary: 'Get QR code for instance linking.'
      operationId: getQRCodeForInstanceLinking
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Instances
    parameters:
      -
        in: path
        name: instancia_public_id
        description: 'The ID of the instancia public.'
        example: architecto
        required: true
        schema:
          type: string
  /api/v1/messages:
    post:
      summary: ''
      operationId: postApiV1Messages
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Messages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recipient:
                  type: string
                  description: 'Must not be greater than 48 characters.'
                  example: b
                body:
                  type: string
                  description: 'Must not be greater than 4096 characters.'
                  example: 'n'
                instancePublicId:
                  type: string
                  description: ''
                  example: architecto
              required:
                - recipient
                - body
                - instancePublicId
  '/api/v1/messages/{mensaje_public_id}':
    get:
      summary: ''
      operationId: getApiV1MessagesMensaje_public_id
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Messages
    parameters:
      -
        in: path
        name: mensaje_public_id
        description: 'The ID of the mensaje public.'
        example: architecto
        required: true
        schema:
          type: string
  /api/v1/health:
    get:
      summary: 'Health check'
      operationId: healthCheck
      description: 'Returns database and Redis connectivity for monitoring.'
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Platform
  /api/v1/tenants:
    get:
      summary: 'List tenants'
      operationId: listTenants
      description: 'Platform service only. Returns paginated tenants.'
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Tenants
    post:
      summary: 'Create tenant'
      operationId: createTenant
      description: 'Idempotent when `externalRef` is supplied and already exists.'
      parameters: []
      responses: {  }
      tags:
        - Tenants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                slug:
                  type: string
                  description: 'Must contain only letters, numbers, dashes and underscores. Must not be greater than 255 characters.'
                  example: 'n'
                externalRef:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: g
                  nullable: true
              required:
                - name
                - slug
  '/api/v1/tenants/{public_id}':
    get:
      summary: 'Show tenant'
      operationId: showTenant
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Tenants
    patch:
      summary: 'Update tenant'
      operationId: updateTenant
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Tenants
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                isActive:
                  type: boolean
                  description: ''
                  example: true
                commercialStatus:
                  type: string
                  description: ''
                  example: null
                planSlug:
                  type: string
                  description: ''
                  example: null
                planName:
                  type: string
                  description: ''
                  example: null
                demoStartedAt:
                  type: string
                  description: ''
                  example: null
                demoExpiresAt:
                  type: string
                  description: ''
                  example: null
                messagesMonthlyLimit:
                  type: string
                  description: ''
                  example: null
    parameters:
      -
        in: path
        name: public_id
        description: 'The ID of the public.'
        example: architecto
        required: true
        schema:
          type: string
  '/api/v1/tenants/{tenant_public_id}/tokens':
    post:
      summary: 'Issue tenant API token'
      operationId: issueTenantAPIToken
      description: 'Platform service only. Returns plain token once.'
      parameters: []
      responses: {  }
      tags:
        - Tenants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                abilities:
                  type: array
                  description: ''
                  example:
                    - cuenta.ver
                  items:
                    type: string
                    enum:
                      - instancias.ver
                      - mensajes.enviar
                      - mensajes.ver
                      - cuenta.ver
              required:
                - name
    parameters:
      -
        in: path
        name: tenant_public_id
        description: 'The ID of the tenant public.'
        example: architecto
        required: true
        schema:
          type: string
  '/api/v1/tenants/{tenant_public_id}/activate-plan':
    post:
      summary: 'Activate paid plan (platform only). Rotates tenant api-client token.'
      operationId: activatePaidPlanplatformOnlyRotatesTenantApiClientToken
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Tenants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                planSlug:
                  type: string
                  description: ''
                  example: starter
                  enum:
                    - demo
                    - starter
                    - business
                    - empresa
                billingCycle:
                  type: string
                  description: ''
                  example: annual
                  enum:
                    - monthly
                    - annual
                orderExternalRef:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: b
                messagesMonthlyLimit:
                  type: integer
                  description: 'This field is required when <code>planSlug</code> is <code>empresa</code>. Must be at least 1000. Must not be greater than 10000000.'
                  example: 22
                  nullable: true
                tokenName:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: g
                  nullable: true
              required:
                - planSlug
                - billingCycle
                - orderExternalRef
    parameters:
      -
        in: path
        name: tenant_public_id
        description: 'The ID of the tenant public.'
        example: architecto
        required: true
        schema:
          type: string
  '/api/v1/tenants/{tenant_public_id}/cancel-commercial':
    post:
      summary: 'Soft-cancel commercial access (platform only). Revokes client tokens; keeps tenant and instances.'
      operationId: softCancelCommercialAccessplatformOnlyRevokesClientTokensKeepsTenantAndInstances
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Tenants
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                  nullable: true
    parameters:
      -
        in: path
        name: tenant_public_id
        description: 'The ID of the tenant public.'
        example: architecto
        required: true
        schema:
          type: string
  '/api/v1/tenants/{tenant_public_id}/reactivate-commercial':
    post:
      summary: 'Reactivate commercial access after soft-cancel (platform only). Issues a fresh client token.'
      operationId: reactivateCommercialAccessAfterSoftCancelplatformOnlyIssuesAFreshClientToken
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Tenants
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                tokenName:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: b
                  nullable: true
    parameters:
      -
        in: path
        name: tenant_public_id
        description: 'The ID of the tenant public.'
        example: architecto
        required: true
        schema:
          type: string
  /api/v1/usage:
    get:
      summary: ''
      operationId: getApiV1Usage
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Usage
  /api/v1/webhooks/incoming:
    post:
      summary: ''
      operationId: postApiV1WebhooksIncoming
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Webhooks
